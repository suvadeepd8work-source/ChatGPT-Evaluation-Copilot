services:
  - type: web
    name: chatgpt-evaluation-backend
    env: python
    buildCommand: pip install -r phase3_backend/requirements.txt
    startCommand: cd phase3_backend && gunicorn main:app -w 4 -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        value: sqlite:///./storage/evaluation.db
      - key: GROQ_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
    disk:
      name: evaluation-storage
      mountPath: /opt/render/project/src/phase3_backend/storage
      sizeGB: 1
